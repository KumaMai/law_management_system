services:
  php:
    build: ./docker/php
    container_name: law_management_php
    volumes:
      - ./src:/var/www/html
    depends_on:
      - db
    networks:
      - law_network

  nginx:
    image: nginx:alpine
    container_name: law_management_nginx
    ports:
      - "8181:80"
    volumes:
      - ./src:/var/www/html
      - ./docker/nginx/default.conf:/etc/nginx/conf.d/default.conf
    depends_on:
      - php
    networks:
      - law_network

  db:
    image: mysql:8.0
    container_name: law_management_db
    environment:
      MYSQL_ROOT_PASSWORD: rootpassword
      MYSQL_DATABASE: law_system
      MYSQL_USER: law_user
      MYSQL_PASSWORD: law_password
    volumes:
      - db_data:/var/lib/mysql
      - ./docker/mysql/init.sql:/docker-entrypoint-initdb.d/init.sql
    ports:
      - "3306:3306"
    networks:
      - law_network

  phpmyadmin:
    image: phpmyadmin/phpmyadmin
    container_name: law_management_phpmyadmin
    environment:
      PMA_HOST: law_management_db
      PMA_USER: law_user
      PMA_PASSWORD: law_password
    ports:
      - "8081:80"
    depends_on:
      - db
    networks:
      - law_network

networks:
  law_network:
    driver: bridge

volumes:
  db_data:
