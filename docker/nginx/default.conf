# ============================================================
# แทนที่/เพิ่มใน: docker/nginx/default.conf
# ช่องโหว่ที่แก้:
#   - Missing Security Headers
#   - ป้องกันไม่ให้ execute PHP ในโฟลเดอร์ uploads
# ============================================================

server {
    listen 80;
    server_name localhost;
    root /var/www/html;
    index index.php;

    # ── Security Headers ──
    add_header X-Frame-Options        "SAMEORIGIN"        always;
    add_header X-Content-Type-Options "nosniff"           always;
    add_header X-XSS-Protection       "1; mode=block"     always;
    add_header Referrer-Policy        "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy     "geolocation=(), microphone=(), camera=()" always;

    # ── ป้องกันไม่ให้ PHP ทำงานในโฟลเดอร์ uploads ──
    # (ป้องกันกรณีที่มีคนอัปโหลด PHP file แล้วเรียกใช้ได้)
    location ~* ^/uploads/.*\.php$ {
        deny all;
        return 403;
    }

    # ── ซ่อนข้อมูล Nginx version ──
    server_tokens off;

    location / {
        try_files $uri $uri/ /index.php?$query_string;
    }

    location ~ \.php$ {
        fastcgi_pass   law_management_php:9000;
        fastcgi_index  index.php;
        fastcgi_param  SCRIPT_FILENAME $document_root$fastcgi_script_name;
        include        fastcgi_params;
    }

    location ~ /\.ht {
        deny all;
    }
}